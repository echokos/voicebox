name: Build CUDA image

on:
  push:
    branches: [cuda]
    paths:
      - 'Dockerfile'
      - 'backend/**'
      - 'web/**'
      - 'app/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/build-cuda.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Free disk space
        run: |
          # CUDA build needs ~30 GB; ubuntu-latest only has ~14 GB free by default
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f
          df -h /

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/echokos/voicebox:cuda-latest
            ghcr.io/echokos/voicebox:cuda-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
